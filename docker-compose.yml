version: '3.8'

services:
  # Shared library (built first as dependency)
  c-lib:
    build:
      context: ./c-lib
      dockerfile: Dockerfile
    image: cola-lib:latest
    container_name: cola-lib
    # This service is used as a dependency, not run directly

  # API service
  c-api:
    build:
      context: ./c-api
      dockerfile: Dockerfile
    image: cola-api:latest
    container_name: cola-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    depends_on:
      - c-lib
    networks:
      - cola-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Client service
  c-client:
    build:
      context: ./c-client
      dockerfile: Dockerfile
    image: cola-client:latest
    container_name: cola-client
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://c-api:3001
    depends_on:
      - c-api
    networks:
      - cola-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  cola-network:
    driver: bridge

volumes:
  # Add any persistent volumes here if needed
  # node_modules:
  #   driver: local
